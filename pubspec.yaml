name: homi
description: Homi - happy homes, easier days.
publish_to: "none"
version: 0.13.0+17

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_messaging: ^16.0.1
  firebase_app_check: ^0.4.0+1
  cloud_functions: ^6.4.0
  google_sign_in: ^6.2.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  google_maps_flutter: ^2.18.0
  google_places_sdk_plus: 1.1.0
  country_flags: 4.1.2
  url_launcher: ^6.3.2
  battery_plus: ^7.0.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.3.0
  crypto: ^3.0.6
  in_app_purchase: ^3.3.0
  # 0.5.0 is the latest Android platform plugin compatible with Homi's
  # Flutter 3.41.5 / Dart 3.11.3 toolchain while moving to Play Billing 8.
  # 0.5.1+ raises the Dart floor to 3.12, so keep this exact until Homi's
  # Flutter toolchain is deliberately upgraded.
  in_app_purchase_android: 0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  image_path: assets/brand/homi_app_icon_master.png
  adaptive_icon_background: "#FFF8F2"
  adaptive_icon_foreground: assets/brand/homi_adaptive_foreground.png
  adaptive_icon_monochrome: assets/brand/homi_monochrome.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#FFF8F2"
  image: assets/brand/homi_splash_mark.png
  android: true
  android_12:
    color: "#FFF8F2"
    image: assets/brand/homi_splash_mark.png
