name: homi
description: Homi - a calmer way to keep home life in order.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_database: ^12.0.1
  firebase_messaging: ^16.0.1
  firebase_app_check: ^0.4.0+1
  google_sign_in: ^7.1.1
  geolocator: ^14.0.2
  battery_plus: ^7.0.0
  google_maps_flutter: ^2.13.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
